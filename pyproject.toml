[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xmcam-py"
version = "0.3.1"
description = "Local-first Python library and CLI for Xiongmai (XM) / iCSee / XMeye IP cameras: discovery, ONVIF, and recording-archive listing/download over DVRIP. No cloud, no internet."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "theundefined", email = "undefine@aramin.net" }]
keywords = [
    "xiongmai", "xm", "icsee", "xmeye", "dvrip", "sofia", "onvif",
    "ip-camera", "cctv", "nvr", "rtsp", "surveillance", "camera",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: System :: Networking",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.3.0",
    "black>=24.0.0",
    "mypy>=1.9.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/theundefined/xmcam-py"
Repository = "https://github.com/theundefined/xmcam-py"
Issues = "https://github.com/theundefined/xmcam-py/issues"

[project.scripts]
xmcam = "xmcam.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xmcam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 120
target-version = ["py39"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
# Classic default rule set (pyflakes + a few pycodestyle error checks), pinned
# so a ruff upgrade does not silently start failing CI on unrelated rules.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
ignore_missing_imports = true
