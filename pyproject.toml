[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xmcam-py"
version = "0.1.0"
description = "Local-first Python library and CLI for Xiongmai (XM) / iCSee / XMeye IP cameras: discovery, ONVIF, and recording-archive listing/download over DVRIP. No cloud, no internet."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "theundefined", email = "undefine@aramin.net" }]
keywords = [
    "xiongmai", "xm", "icsee", "xmeye", "dvrip", "sofia", "onvif",
    "ip-camera", "cctv", "nvr", "rtsp", "surveillance", "camera",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: System :: Networking",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/theundefined/xmcam-py"
Repository = "https://github.com/theundefined/xmcam-py"
Issues = "https://github.com/theundefined/xmcam-py/issues"

[project.scripts]
xmcam = "xmcam.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xmcam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
